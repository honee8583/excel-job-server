<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>데이터 요청 목록</title>
<style>
  body { margin: 0; background: #f6f6f4; font-family: Pretendard, system-ui, -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif; color: #1b1b1a; -webkit-font-smoothing: antialiased; }
  .wrap { max-width: 1120px; margin: 0 auto; padding: 56px 32px 80px; display: flex; flex-direction: column; gap: 28px; }
  header { display: flex; align-items: flex-end; justify-content: space-between; gap: 24px; flex-wrap: wrap; }
  .eyebrow { font-size: 13px; font-weight: 600; letter-spacing: .04em; color: #2f5d50; }
  h1 { margin: 8px 0; font-size: 30px; font-weight: 700; letter-spacing: -.02em; }
  .desc { margin: 0; font-size: 15px; color: #6b6b66; }
  button { display: flex; align-items: center; gap: 8px; height: 44px; padding: 0 20px; border: 0; border-radius: 8px; background: #2f5d50; color: #fff; font: inherit; font-size: 15px; font-weight: 600; cursor: pointer; }
  button:hover { background: #244a40; }
  button:disabled { opacity: .6; cursor: default; }
  button.more { align-self: center; background: #fff; color: #1b1b1a; border: 1px solid #e6e5e0; font-size: 14px; }
  button.more:hover { background: #f0efea; }
  button[hidden] { display: none; }
  .bar { display: flex; align-items: center; justify-content: flex-end; gap: 16px; flex-wrap: wrap; font-size: 13px; color: #6b6b66; }
  .live { display: flex; align-items: center; gap: 8px; }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: #3f9a6e; }
  .live.error .dot { background: #a33a2b; }
  .card { background: #fff; border: 1px solid #e6e5e0; border-radius: 12px; overflow-x: auto; }
  table { width: 100%; min-width: 860px; border-collapse: collapse; font-size: 14px; }
  th { text-align: left; color: #6b6b66; font-size: 12px; font-weight: 600; padding: 14px 20px; border-bottom: 1px solid #e6e5e0; }
  td { padding: 16px 20px; font-variant-numeric: tabular-nums; }
  tbody tr { border-bottom: 1px solid #f0efea; }
  .mono { font-family: ui-monospace, Menlo, monospace; }
  .id { font-size: 13px; font-weight: 600; }
  .muted { color: #4a4a46; }
  .path { font-size: 12px; color: #2f5d50; }
  .none { color: #b0afa8; }
  .empty { padding: 48px 20px; text-align: center; color: #6b6b66; }
  .badge { display: inline-flex; align-items: center; gap: 6px; height: 26px; padding: 0 10px; border-radius: 999px; font-size: 12px; font-weight: 600; }
  .pending { background: #f1f0eb; color: #5c5c57; }
  .processing { background: #e6efff; color: #2a55b8; }
  .done { background: #e3f2ea; color: #22704b; }
  .failed { background: #fbe7e4; color: #a33a2b; }
  .spin { width: 10px; height: 10px; border: 2px solid currentColor; border-right-color: transparent; border-radius: 50%; animation: spin .8s linear infinite; box-sizing: border-box; }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <div class="eyebrow">EXCEL EXPORT</div>
      <h1>데이터 요청 목록</h1>
      <p class="desc">주문 데이터 100,000건을 엑셀 파일로 생성합니다. 요청은 백그라운드에서 처리됩니다.</p>
    </div>
    <button id="request"><span style="font-size:18px;line-height:1">+</span>엑셀 생성 요청</button>
  </header>

  <div class="bar">
    <div class="live" id="live"><span class="dot"></span><span id="live-text">2초 간격 폴링 중</span></div>
  </div>

  <div class="card">
    <table>
      <thead>
        <tr><th>JOB ID</th><th>요청일시</th><th>시작시간</th><th>완료시간</th><th>상태</th><th>파일경로</th></tr>
      </thead>
      <tbody id="jobs"><tr><td colspan="6" class="empty">불러오는 중…</td></tr></tbody>
    </table>
  </div>
  <button id="more" class="more" hidden>더 보기</button>
</div>

<script>
  const LABELS = { pending: '대기', processing: '처리중', done: '완료', failed: '실패' };
  const ACTIVE_POLL_MS = 2000;  // pending/processing job이 있을 때
  const IDLE_POLL_MS = 10000;   // 없을 때: 다른 탭/사용자의 요청만 감지하면 되므로 느리게
  let pollTimer;
  let jobs = [];          // 화면에 보이는 job (id 내림차순)
  let nextCursor = null;  // 더 보기 시 넘길 cursor. null이면 마지막 페이지

  async function getJson(url) {
    const res = await fetch(url);
    if (!res.ok) throw new Error(res.status);
    return res.json();
  }

  const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
  // "2026-10-02T14:32:08" -> "2026-10-02 14:32:08"
  const fmt = t => t ? t.replace('T', ' ').slice(0, 19) : '—';

  function pathCell(job) {
    if (job.status === 'done') return `<span class="mono path">${esc(job.filePath)}</span>`;
    if (job.status === 'failed') return `<span class="none" title="${esc(job.errorMessage ?? '')}">생성 실패</span>`;
    return '<span class="none">—</span>';
  }

  function render() {
    document.getElementById('jobs').innerHTML = jobs.length === 0
      ? '<tr><td colspan="6" class="empty">요청 내역이 없습니다.</td></tr>'
      : jobs.map(j => `
        <tr>
          <td class="mono id">#${j.id}</td>
          <td>${fmt(j.requestedAt)}</td>
          <td class="muted">${fmt(j.startedAt)}</td>
          <td class="muted">${fmt(j.completedAt)}</td>
          <td><span class="badge ${esc(j.status)}">${j.status === 'processing' ? '<span class="spin"></span>' : ''}${LABELS[j.status] ?? esc(j.status)}</span></td>
          <td>${pathCell(j)}</td>
        </tr>`).join('');
    document.getElementById('more').hidden = nextCursor === null;
  }

  function setLive(text, ok) {
    document.getElementById('live').classList.toggle('error', !ok);
    document.getElementById('live-text').textContent = text;
  }

  // setInterval 대신 응답 후 다음 요청을 예약해 요청이 겹치지 않게 한다
  async function load() {
    clearTimeout(pollTimer);
    let delay = ACTIVE_POLL_MS;
    try {
      const page = await getJson('/api/jobs');
      // 첫 페이지로 위쪽을 교체하고, 더 보기로 받아둔 그보다 오래된 job은 유지한다.
      // ponytail: 더 보기로 받은 job의 상태는 폴링으로 갱신되지 않음. 대기 job이 한 페이지를 넘을 때만 문제 → 진행 중인 job만 폴링하도록 확장
      const minId = page.items.length ? page.items.at(-1).id : Infinity;
      const older = jobs.filter(j => j.id < minId);
      jobs = [...page.items, ...older];
      if (older.length === 0) nextCursor = page.nextCursor;
      render();
      // 대기/처리중 job은 최신 요청이므로 첫 페이지만 보면 충분하다
      const active = page.items.some(j => j.status === 'pending' || j.status === 'processing');
      delay = active ? ACTIVE_POLL_MS : IDLE_POLL_MS;
      setLive(active ? '2초 간격 폴링 중' : '진행 중인 작업 없음', true);
    } catch (e) {
      setLive('서버 연결 실패 — 재시도 중', false);
    }
    clearTimeout(pollTimer); // 폴링 중 버튼 클릭으로 load가 겹쳐도 예약은 하나만 유지
    pollTimer = setTimeout(() => { if (!document.hidden) load(); else pollTimer = null; }, delay);
  }

  // 숨겨진 탭에서는 폴링을 멈추고, 다시 보이면 즉시 갱신한다
  document.addEventListener('visibilitychange', () => { if (!document.hidden && !pollTimer) load(); });

  document.getElementById('request').addEventListener('click', async e => {
    const btn = e.currentTarget;
    btn.disabled = true; // 연타로 인한 중복 요청 방지
    try {
      const res = await fetch('/api/jobs', { method: 'POST' });
      if (!res.ok) throw new Error(res.status);
      await load();
    } catch (err) {
      alert('엑셀 생성 요청에 실패했습니다.');
    } finally {
      btn.disabled = false;
    }
  });

  document.getElementById('more').addEventListener('click', async e => {
    const btn = e.currentTarget;
    btn.disabled = true;
    try {
      const page = await getJson(`/api/jobs?cursor=${nextCursor}`);
      const lastId = jobs.length ? jobs.at(-1).id : Infinity;
      jobs = [...jobs, ...page.items.filter(j => j.id < lastId)]; // 폴링과 겹쳐도 중복 방지
      nextCursor = page.nextCursor;
      render();
    } catch (err) {
      alert('목록을 더 불러오지 못했습니다.');
    } finally {
      btn.disabled = false;
    }
  });

  load();
</script>
</body>
</html>
