spring:
  application:
    name: excel-job-server
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/excel_job?serverTimezone=Asia/Seoul&characterEncoding=UTF-8}
    username: ${DB_USERNAME:app}
    password: ${DB_PASSWORD:app}

excel:
  storage-dir: ${EXCEL_STORAGE_DIR:./data/excel}
  # 근거: 허용할 최대 대기 시간 2분 / job 1개 처리 약 10초 = 약 12개 -> 10개 ?
  max-active-jobs: ${EXCEL_MAX_ACTIVE_JOBS:10}
