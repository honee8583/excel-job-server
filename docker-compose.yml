services:
  db:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: excel_job
      MYSQL_USER: app
      MYSQL_PASSWORD: app
      TZ: Asia/Seoul
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    ports:
      - "3306:3306"
    volumes:
      - ./db/init:/docker-entrypoint-initdb.d:ro
      - db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot"]
      interval: 5s
      timeout: 3s
      retries: 30

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_URL: jdbc:mysql://db:3306/excel_job?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
      DB_USERNAME: app
      DB_PASSWORD: app
      EXCEL_STORAGE_DIR: /data/excel
      TZ: Asia/Seoul
    ports:
      - "8080:8080"
    volumes:
      - excel-files:/data/excel
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 1G
        reservations:
          cpus: '0.25'
          memory: 512M

volumes:
  db-data:
  excel-files:
